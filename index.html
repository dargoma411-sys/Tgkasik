<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Case Drop</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    :root {
        --bg: #0f1117;
        --bg-2: #171a23;
        --bg-3: #1f232f;
        --line: #2a2f3d;
        --text: #e8ecf4;
        --muted: #8a93a6;
        --accent: #f5a623;
        --accent-2: #ffcc4d;
        --green: #4caf50;
        --blue: #3b82f6;
        --purple: #a855f7;
        --gold: #f59e0b;
        --red: #ef4444;
    }

    body {
        background: radial-gradient(circle at 50% 0%, #1a1f2e 0%, #0f1117 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        padding-bottom: 20px;
    }

    /* === ШАПКА === */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        background: rgba(23, 26, 35, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 1px;
    }

    .logo-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #ff7b00);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        box-shadow: 0 0 18px rgba(245, 166, 35, 0.5);
    }

    .balance {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-3);
        border: 1px solid var(--line);
        padding: 8px 14px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.95rem;
    }

    .balance .coin { font-size: 1.05rem; }
    .balance .amount {
        color: var(--accent-2);
        min-width: 52px;
        text-align: right;
    }

    .balance.plus { animation: balancePop 0.4s ease; }
    .balance.minus { animation: balanceShake 0.4s ease; }

    @keyframes balancePop {
        0% { transform: scale(1); }
        50% { transform: scale(1.12); box-shadow: 0 0 20px rgba(76, 175, 80, 0.6); }
        100% { transform: scale(1); }
    }

    @keyframes balanceShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }

    /* === ВКЛАДКИ === */
    .tabs {
        display: flex;
        gap: 6px;
        padding: 12px 16px 0;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
    }

    .tab {
        flex: 1;
        padding: 10px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }

    .tab.active {
        background: linear-gradient(135deg, var(--accent), #ff7b00);
        color: #1a1200;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(245, 166, 35, 0.35);
    }

    /* === ОСНОВНОЙ ЭКРАН === */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
    }

    .view { display: none; width: 100%; }
    .view.active { display: block; }

    .case-title {
        text-align: center;
        margin-bottom: 14px;
    }

    .case-title h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .case-title p {
        color: var(--muted);
        font-size: 0.88rem;
    }

    /* === ВЫБОР КЕЙСА === */
    .case-picker {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
    }

    .case-option {
        background: var(--bg-2);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 14px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }

    .case-option.active {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(245, 166, 35, 0.3);
        background: linear-gradient(160deg, #232838, #1a1e28);
    }

    .case-option .case-emoji {
        font-size: 2rem;
        margin-bottom: 6px;
        display: block;
    }

    .case-option .case-name {
        font-size: 0.85rem;
        font-weight: 800;
        margin-bottom: 4px;
    }

    .case-option .case-price {
        font-size: 0.8rem;
        color: var(--accent-2);
        font-weight: 700;
    }

    .case-option .case-glow {
        position: absolute;
        inset: -30%;
        background: radial-gradient(circle, rgba(245, 166, 35, 0.15) 0%, transparent 60%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .case-option.active .case-glow { opacity: 1; }

    /* === ВИЗУАЛ КЕЙСА === */
    .case-visual {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 8px auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .case-visual .case-box {
        width: 150px;
        height: 150px;
        border-radius: 22px;
        background: linear-gradient(145deg, #232838, #171a23);
        border: 2px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        position: relative;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        animation: caseFloat 3s ease-in-out infinite;
        transition: transform 0.3s;
    }

    .case-visual .case-box.opening { animation: caseShake 0.5s ease; }

    @keyframes caseFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    @keyframes caseShake {
        0%, 100% { transform: translateX(0) rotate(0); }
        20% { transform: translateX(-6px) rotate(-3deg); }
        40% { transform: translateX(6px) rotate(3deg); }
        60% { transform: translateX(-6px) rotate(-3deg); }
        80% { transform: translateX(6px) rotate(3deg); }
    }

    .case-visual .glow {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 166, 35, 0.35) 0%, transparent 70%);
        animation: glowPulse 2.5s ease-in-out infinite;
        z-index: -1;
    }

    @keyframes glowPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
    }

    /* === РУЛЕТКА === */
    .roulette-wrap {
        width: 100%;
        position: relative;
        margin-bottom: 16px;
        border-radius: 16px;
        overflow: hidden;
        background: linear-gradient(180deg, #171a23, #12151c);
        border: 1px solid var(--line);
        padding: 14px 0;
    }

    .roulette-marker {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        background: linear-gradient(180deg, transparent, var(--accent), transparent);
        transform: translateX(-50%);
        z-index: 10;
        box-shadow: 0 0 12px var(--accent);
    }

    .roulette-marker::before,
    .roulette-marker::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
    }

    .roulette-marker::before {
        top: -2px;
        border-top: 9px solid var(--accent);
    }

    .roulette-marker::after {
        bottom: -2px;
        border-bottom: 9px solid var(--accent);
    }

    .roulette {
        display: flex;
        gap: 10px;
        transition: transform 6s cubic-bezier(0.15, 0.9, 0.25, 1);
        will-change: transform;
        padding: 0 10px;
    }

    .roulette .item {
        flex: 0 0 96px;
        height: 110px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        position: relative;
        background: #1b1f2b;
        border: 2px solid var(--line);
        overflow: hidden;
    }

    .roulette .item .emoji {
        font-size: 2.2rem;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .roulette .item .label {
        font-size: 0.65rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
        padding: 0 4px;
        line-height: 1.2;
    }

    .roulette .item .price-tag {
        font-size: 0.7rem;
        color: var(--accent-2);
        font-weight: 700;
    }

    .roulette .item::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--muted);
    }

    .roulette .item.r-common::before { background: var(--muted); }
    .roulette .item.r-rare::before { background: var(--blue); }
    .roulette .item.r-epic::before { background: var(--purple); }
    .roulette .item.r-legend::before { background: var(--gold); }

    .roulette .item.r-common { box-shadow: inset 0 0 20px rgba(138, 147, 166, 0.08); }
    .roulette .item.r-rare { box-shadow: inset 0 0 25px rgba(59, 130, 246, 0.18); }
    .roulette .item.r-epic { box-shadow: inset 0 0 30px rgba(168, 85, 247, 0.22); }
    .roulette .item.r-legend {
        box-shadow: inset 0 0 35px rgba(245, 158, 11, 0.3), 0 0 25px rgba(245, 158, 11, 0.25);
        border-color: var(--gold);
    }

    .roulette .item.r-legend::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(245, 158, 11, 0.35) 50%, transparent 70%);
        animation: shine 1.8s linear infinite;
    }

    @keyframes shine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    /* === КНОПКИ === */
    .actions {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-bottom: 12px;
    }

    .btn {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent), #ff7b00);
        color: #1a1200;
        box-shadow: 0 8px 24px rgba(245, 166, 35, 0.35);
    }

    .btn-primary:hover { box-shadow: 0 10px 30px rgba(245, 166, 35, 0.55); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    .btn-secondary {
        background: var(--bg-3);
        color: var(--text);
        border: 1px solid var(--line);
        flex: 0 0 auto;
        padding: 16px 22px;
    }

    .btn-secondary:hover { background: #252a38; }

    /* === ИСТОРИЯ === */
    .history { width: 100%; margin-top: 8px; }

    .history h3 {
        font-size: 0.9rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        font-weight: 600;
    }

    .history-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 300px;
        overflow-y: auto;
        padding-right: 4px;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    .history-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        animation: historyIn 0.4s ease;
    }

    @keyframes historyIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .history-item .h-emoji { font-size: 1.6rem; }
    .history-item .h-info { flex: 1; }
    .history-item .h-name { font-size: 0.9rem; font-weight: 700; }
    .history-item .h-rarity { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .history-item .h-rarity.r-common { color: var(--muted); }
    .history-item .h-rarity.r-rare { color: var(--blue); }
    .history-item .h-rarity.r-epic { color: var(--purple); }
    .history-item .h-rarity.r-legend { color: var(--gold); }
    .history-item .h-time { font-size: 0.72rem; color: var(--muted); }

    .empty-history {
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        padding: 20px;
        border: 1px dashed var(--line);
        border-radius: 12px;
    }

    /* === ИНВЕНТАРЬ === */
    .inventory-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 14px;
    }

    .inventory-summary .inv-label {
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }

    .inventory-summary .inv-value {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--accent-2);
    }

    .inventory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
    }

    .inv-card {
        background: linear-gradient(160deg, #1b1f2b, #14171f);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 14px 10px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all 0.2s;
    }

    .inv-card.r-common { border-color: #3a4050; }
    .inv-card.r-rare { border-color: var(--blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    .inv-card.r-epic { border-color: var(--purple); box-shadow: 0 0 18px rgba(168, 85, 247, 0.25); }
    .inv-card.r-legend {
        border-color: var(--gold);
        box-shadow: 0 0 22px rgba(245, 158, 11, 0.35);
    }

    .inv-card .inv-emoji {
        font-size: 2.2rem;
        margin-bottom: 6px;
        display: block;
    }

    .inv-card .inv-name {
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 3px;
    }

    .inv-card .inv-rarity {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .inv-card .inv-rarity.r-common { color: var(--muted); }
    .inv-card .inv-rarity.r-rare { color: var(--blue); }
    .inv-card .inv-rarity.r-epic { color: var(--purple); }
    .inv-card .inv-rarity.r-legend { color: var(--gold); }

    .inv-card .inv-price {
        font-size: 0.8rem;
        color: var(--accent-2);
        font-weight: 700;
        margin-bottom: 10px;
    }

    .inv-card .inv-sell {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--green), #2e7d32);
        color: white;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .inv-card .inv-sell:active { transform: scale(0.96); }
    .inv-card .inv-sell:hover { box-shadow: 0 4px 14px rgba(76, 175, 80, 0.4); }

    /* === МОДАЛКА ВЫПАДЕНИЯ === */
    .drop-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .drop-modal.show {
        display: flex;
        opacity: 1;
    }

    .drop-card {
        background: linear-gradient(160deg, #1f232f, #14171f);
        border: 2px solid var(--line);
        border-radius: 22px;
        padding: 36px 28px 28px;
        text-align: center;
        max-width: 340px;
        width: 100%;
        position: relative;
        animation: dropIn 0.5s cubic-bezier(0.2, 1.2, 0.3, 1);
    }

    @keyframes dropIn {
        from { opacity: 0; transform: scale(0.7) translateY(30px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .drop-card.r-common { border-color: var(--muted); box-shadow: 0 0 40px rgba(138, 147, 166, 0.25); }
    .drop-card.r-rare { border-color: var(--blue); box-shadow: 0 0 50px rgba(59, 130, 246, 0.4); }
    .drop-card.r-epic { border-color: var(--purple); box-shadow: 0 0 60px rgba(168, 85, 247, 0.5); }
    .drop-card.r-legend {
        border-color: var(--gold);
        box-shadow: 0 0 80px rgba(245, 158, 11, 0.6);
        animation: dropIn 0.5s cubic-bezier(0.2, 1.2, 0.3, 1), legendGlow 1.5s ease-in-out infinite alternate;
    }

    @keyframes legendGlow {
        from { box-shadow: 0 0 60px rgba(245, 158, 11, 0.5); }
        to { box-shadow: 0 0 100px rgba(245, 158, 11, 0.9); }
    }

    .drop-card .drop-emoji {
        font-size: 5rem;
        margin-bottom: 12px;
        filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
        animation: emojiPop 0.6s ease;
    }

    @keyframes emojiPop {
        0% { transform: scale(0); }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    .drop-card .drop-rarity {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 800;
        margin-bottom: 6px;
    }

    .drop-card.r-common .drop-rarity { color: var(--muted); }
    .drop-card.r-rare .drop-rarity { color: var(--blue); }
    .drop-card.r-epic .drop-rarity { color: var(--purple); }
    .drop-card.r-legend .drop-rarity { color: var(--gold); }

    .drop-card .drop-name {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .drop-card .drop-price {
        font-size: 1rem;
        color: var(--accent-2);
        font-weight: 700;
        margin-bottom: 20px;
    }

    .drop-card .drop-actions {
        display: flex;
        gap: 10px;
    }

    .drop-card .drop-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .drop-card .drop-btn:active { transform: scale(0.97); }

    .drop-card .drop-btn.keep {
        background: var(--bg-3);
        color: var(--text);
        border: 1px solid var(--line);
    }

    .drop-card .drop-btn.sell {
        background: linear-gradient(135deg, var(--green), #2e7d32);
        color: white;
    }

    .drop-card .drop-btn.sell:hover { box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4); }

    /* === ФУТЕР === */
    .footer-note {
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        padding: 24px 20px 10px;
        opacity: 0.6;
    }

    /* === АДАПТИВ === */
    @media (max-width: 420px) {
        .case-title h1 { font-size: 1.3rem; }
        .roulette .item { flex: 0 0 84px; height: 100px; }
        .roulette .item .emoji { font-size: 1.9rem; }
        .btn { font-size: 0.85rem; padding: 14px 10px; }
        .case-picker { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="topbar">
        <div class="logo">
            <div class="logo-icon">🎁</div>
            <span>CASE DROP</span>
        </div>
        <div class="balance" id="balanceBox">
            <span class="coin">🪙</span>
            <span class="amount" id="balanceAmount">1000</span>
        </div>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs">
        <div class="tab active" data-view="cases" onclick="switchTab('cases')">Кейсы</div>
        <div class="tab" data-view="inventory" onclick="switchTab('inventory')">Инвентарь</div>
        <div class="tab" data-view="history" onclick="switchTab('history')">История</div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div class="main">

        <!-- ВКЛАДКА: КЕЙСЫ -->
        <div class="view active" id="view-cases">

            <div class="case-title">
                <h1>Открой кейс</h1>
                <p>Испытай удачу — получи редкий предмет</p>
            </div>

            <!-- ВЫБОР КЕЙСА -->
            <div class="case-picker" id="casePicker"></div>

            <!-- ВИЗУАЛ КЕЙСА -->
            <div class="case-visual">
                <div class="glow"></div>
                <div class="case-box" id="caseBox">🎁</div>
            </div>

            <!-- РУЛЕТКА -->
            <div class="roulette-wrap">
                <div class="roulette-marker"></div>
                <div class="roulette" id="roulette"></div>
            </div>

            <!-- КНОПКИ -->
            <div class="actions">
                <button class="btn btn-primary" id="openBtn" onclick="openCase()">Открыть</button>
                <button class="btn btn-secondary" id="resetBtn" onclick="resetDemo()">↺</button>
            </div>

        </div>

        <!-- ВКЛАДКА: ИНВЕНТАРЬ -->
        <div class="view" id="view-inventory">
            <div class="inventory-summary">
                <span class="inv-label">Предметов: <span id="invCount">0</span></span>
                <span class="inv-value">Общая стоимость: <span id="invTotal">0</span> 🪙</span>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <div class="empty-history" style="grid-column: 1/-1;">Инвентарь пуст — открой кейс</div>
            </div>
        </div>

        <!-- ВКЛАДКА: ИСТОРИЯ -->
        <div class="view" id="view-history">
            <div class="history">
                <h3>Последние открытия</h3>
                <div class="history-list" id="historyList">
                    <div class="empty-history">Пока пусто — открой первый кейс</div>
                </div>
            </div>
        </div>

    </div>

    <!-- МОДАЛКА ВЫПАДЕНИЯ -->
    <div class="drop-modal" id="dropModal">
        <div class="drop-card" id="dropCard">
            <div class="drop-emoji" id="dropEmoji">🎁</div>
            <div class="drop-rarity" id="dropRarity">Обычный</div>
            <div class="drop-name" id="dropName">Предмет</div>
            <div class="drop-price" id="dropPrice">+0 🪙</div>
            <div class="drop-actions">
                <button class="drop-btn keep" onclick="keepDrop()">Оставить</button>
                <button class="drop-btn sell" onclick="sellDrop()">Продать</button>
            </div>
        </div>
    </div>

    <div class="footer-note">
        Демо-версия · Все предметы виртуальные
    </div>

<script>
    // === РЕДКОСТИ ===
    const RARITY_LABELS = {
        common: 'Обычный',
        rare: 'Редкий',
        epic: 'Эпический',
        legend: 'Легендарный'
    };

    // === КЕЙСЫ ===
    const CASES = [
        {
            id: 'starter',
            emoji: '📦',
            name: 'Стартовый',
            price: 100,
            items: [
                { emoji: '🪙', name: 'Монета', rarity: 'common', price: 30, weight: 30 },
                { emoji: '🧦', name: 'Носок', rarity: 'common', price: 20, weight: 20 },
                { emoji: '🍪', name: 'Печенье', rarity: 'common', price: 25, weight: 20 },
                { emoji: '📎', name: 'Скрепка', rarity: 'common', price: 15, weight: 15 },
                { emoji: '🎈', name: 'Шарик', rarity: 'rare', price: 80, weight: 8 },
                { emoji: '💎', name: 'Кристалл', rarity: 'rare', price: 120, weight: 5 },
                { emoji: '🏆', name: 'Кубок', rarity: 'epic', price: 300, weight: 1.5 },
                { emoji: '🐉', name: 'Дракон', rarity: 'legend', price: 800, weight: 0.5 }
            ]
        },
        {
            id: 'silver',
            emoji: '🎁',
            name: 'Серебряный',
            price: 500,
            items: [
                { emoji: '🍪', name: 'Печенье', rarity: 'common', price: 25, weight: 20 },
                { emoji: '🔔', name: 'Колокольчик', rarity: 'common', price: 60, weight: 15 },
                { emoji: '🧸', name: 'Мишка', rarity: 'common', price: 90, weight: 15 },
                { emoji: '🎧', name: 'Наушники', rarity: 'rare', price: 250, weight: 15 },
                { emoji: '🎮', name: 'Геймпад', rarity: 'rare', price: 320, weight: 15 },
                { emoji: '📱', name: 'Телефон', rarity: 'epic', price: 700, weight: 10 },
                { emoji: '👑', name: 'Корона', rarity: 'epic', price: 900, weight: 7 },
                { emoji: '🚀', name: 'Ракета', rarity: 'legend', price: 2500, weight: 3 }
            ]
        },
        {
            id: 'gold',
            emoji: '🏅',
            name: 'Золотой',
            price: 1500,
            items: [
                { emoji: '🔔', name: 'Колокольчик', rarity: 'common', price: 60, weight: 20 },
                { emoji: '🧸', name: 'Мишка', rarity: 'common', price: 90, weight: 15 },
                { emoji: '💍', name: 'Кольцо', rarity: 'common', price: 150, weight: 15 },
                { emoji: '🎧', name: 'Наушники', rarity: 'rare', price: 250, weight: 12 },
                { emoji: '💻', name: 'Ноутбук', rarity: 'rare', price: 500, weight: 10 },
                { emoji: '📱', name: 'Телефон', rarity: 'epic', price: 700, weight: 10 },
                { emoji: '💎', name: 'Алмаз', rarity: 'epic', price: 1500, weight: 10 },
                { emoji: '👑', name: 'Корона', rarity: 'legend', price: 5000, weight: 5 },
                { emoji: '🐉', name: 'Дракон', rarity: 'legend', price: 8000, weight: 3 }
            ]
        },
        {
            id: 'diamond',
            emoji: '💎',
            name: 'Алмазный',
            price: 5000,
            items: [
                { emoji: '💍', name: 'Кольцо', rarity: 'common', price: 150, weight: 20 },
                { emoji: '💻', name: 'Ноутбук', rarity: 'common', price: 500, weight: 15 },
                { emoji: '🎧', name: 'Наушники', rarity: 'rare', price: 250, weight: 12 },
                { emoji: '📱', name: 'Телефон', rarity: 'rare', price: 700, weight: 12 },
                { emoji: '💎', name: 'Алмаз', rarity: 'epic', price: 1500, weight: 15 },
                { emoji: '🏎', name: 'Болид', rarity: 'epic', price: 3000, weight: 10 },
                { emoji: '👑', name: 'Корона', rarity: 'legend', price: 5000, weight: 8 },
                { emoji: '🚀', name: 'Ракета', rarity: 'legend', price: 12000, weight: 5 },
                { emoji: '🐉', name: 'Дракон', rarity: 'legend', price: 20000, weight: 3 }
            ]
        },
        {
            id: 'legendary',
            emoji: '🐉',
            name: 'Легендарный',
            price: 15000,
            items: [
                { emoji: '💻', name: 'Ноутбук', rarity: 'common', price: 500, weight: 20 },
                { emoji: '📱', name: 'Телефон', rarity: 'common', price: 700, weight: 15 },
                { emoji: '💎', name: 'Алмаз', rarity: 'rare', price: 1500, weight: 15 },
                { emoji: '🏎', name: 'Болид', rarity: 'rare', price: 3000, weight: 12 },
                { emoji: '👑', name: 'Корона', rarity: 'epic', price: 5000, weight: 12 },
                { emoji: '🚀', name: 'Ракета', rarity: 'epic', price: 12000, weight: 10 },
                { emoji: '🐉', name: 'Дракон', rarity: 'legend', price: 20000, weight: 8 },
                { emoji: '🌟', name: 'Суперзвезда', rarity: 'legend', price: 50000, weight: 5 },
                { emoji: '👽', name: 'Пришелец', rarity: 'legend', price: 100000, weight: 3 }
            ]
        }
    ];

    const START_BALANCE = 1000;
    const HISTORY_LIMIT = 30;

    let balance = START_BALANCE;
    let isOpening = false;
    let history = [];
    let inventory = [];
    let currentCaseId = CASES[0].id;
    let pendingDrop = null;

    // === УТИЛИТЫ ===
    function getCurrentCase() {
        return CASES.find(c => c.id === currentCaseId) || CASES[0];
    }

    function pickRandomItem(caseObj) {
        const items = caseObj.items;
        const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
        let random = Math.random() * totalWeight;
        for (const item of items) {
            random -= item.weight;
            if (random <= 0) return item;
        }
        return items[0];
    }

    function formatPrice(n) {
        return n.toLocaleString('ru-RU');
    }

    // === ВКЛАДКИ ===
    function switchTab(view) {
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.view === view);
        });
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
    }

    // === ВЫБОР КЕЙСА ===
    function renderCasePicker() {
        const picker = document.getElementById('casePicker');
        picker.innerHTML = CASES.map(c => `
            <div class="case-option ${c.id === currentCaseId ? 'active' : ''}" onclick="selectCase('${c.id}')">
                <div class="case-glow"></div>
                <span class="case-emoji">${c.emoji}</span>
                <div class="case-name">${c.name}</div>
                <div class="case-price">${formatPrice(c.price)} 🪙</div>
            </div>
        `).join('');
        updateOpenButton();
    }

    function selectCase(id) {
        if (isOpening) return;
        currentCaseId = id;
        renderCasePicker();
        resetRoulette();
    }

    // === РУЛЕТКА ===
    function buildRouletteItem(item) {
        return `
            <div class="emoji">${item.emoji}</div>
            <div class="label">${item.name}</div>
            <div class="price-tag">${formatPrice(item.price)} 🪙</div>
        `;
    }

    function resetRoulette() {
        const roulette = document.getElementById('roulette');
        const caseObj = getCurrentCase();
        roulette.style.transition = 'none';
        roulette.style.transform = 'translateX(0)';
        roulette.innerHTML = '';
        for (let i = 0; i < 60; i++) {
            const item = pickRandomItem(caseObj);
            const el = document.createElement('div');
            el.className = `item r-${item.rarity}`;
            el.innerHTML = buildRouletteItem(item);
            roulette.appendChild(el);
        }
    }

    function generateRoulette() {
        const roulette = document.getElementById('roulette');
        const caseObj = getCurrentCase();
        roulette.innerHTML = '';
        const winItem = pickRandomItem(caseObj);
        const winIndex = 45;

        for (let i = 0; i < 60; i++) {
            const item = i === winIndex ? winItem : pickRandomItem(caseObj);
            const el = document.createElement('div');
            el.className = `item r-${item.rarity}`;
            el.innerHTML = buildRouletteItem(item);
            roulette.appendChild(el);
        }
        return { winItem, winIndex };
    }

    // === ОТКРЫТИЕ КЕЙСА ===
    function updateOpenButton() {
        const btn = document.getElementById('openBtn');
        const caseObj = getCurrentCase();
        btn.textContent = `Открыть за ${formatPrice(caseObj.price)} 🪙`;
    }

    function openCase() {
        if (isOpening) return;
        const caseObj = getCurrentCase();

        if (balance < caseObj.price) {
            shakeBalance();
            return;
        }

        isOpening = true;
        balance -= caseObj.price;
        updateBalance('minus');

        const openBtn = document.getElementById('openBtn');
        openBtn.disabled = true;

        const caseBox = document.getElementById('caseBox');
        caseBox.classList.add('opening');
        caseBox.textContent = '📦';

        setTimeout(() => {
            caseBox.classList.remove('opening');
            caseBox.textContent = caseObj.emoji;
        }, 500);

        const { winItem, winIndex } = generateRoulette();
        const roulette = document.getElementById('roulette');

        roulette.style.transition = 'none';
        roulette.style.transform = 'translateX(0)';

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const itemWidth = 96 + 10;
                const containerWidth = roulette.parentElement.offsetWidth;
                const centerOffset = containerWidth / 2 - itemWidth / 2;
                const targetX = -(winIndex * itemWidth) + centerOffset + (Math.random() * 40 - 20);

                roulette.style.transition = 'transform 6s cubic-bezier(0.15, 0.9, 0.25, 1)';
                roulette.style.transform = `translateX(${targetX}px)`;
            });
        });

        setTimeout(() => {
            showDrop(winItem);
            addToHistory(winItem);
            isOpening = false;
            openBtn.disabled = false;
        }, 6200);
    }

    // === МОДАЛКА ===
    function showDrop(item) {
        pendingDrop = item;
        const modal = document.getElementById('dropModal');
        const card = document.getElementById('dropCard');
        const emoji = document.getElementById('dropEmoji');
        const rarity = document.getElementById('dropRarity');
        const name = document.getElementById('dropName');
        const price = document.getElementById('dropPrice');

        card.className = 'drop-card r-' + item.rarity;
        emoji.textContent = item.emoji;
        rarity.textContent = RARITY_LABELS[item.rarity];
        name.textContent = item.name;
        price.textContent = `Стоимость: ${formatPrice(item.price)} 🪙`;

        modal.classList.add('show');
    }

    function keepDrop() {
        if (!pendingDrop) return;
        inventory.push(pendingDrop);
        pendingDrop = null;
        renderInventory();
        closeDrop();
    }

    function sellDrop() {
        if (!pendingDrop) return;
        balance += pendingDrop.price;
        updateBalance('plus');
        addToHistory({ ...pendingDrop, sold: true });
        pendingDrop = null;
        renderInventory();
        closeDrop();
    }

    function closeDrop() {
        document.getElementById('dropModal').classList.remove('show');
        pendingDrop = null;
    }

    // === ИСТОРИЯ ===
    function addToHistory(item) {
        const now = new Date();
        const time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        history.unshift({ ...item, time });
        if (history.length > HISTORY_LIMIT) history.pop();
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (history.length === 0) {
            list.innerHTML = '<div class="empty-history">Пока пусто — открой первый кейс</div>';
            return;
        }
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="h-emoji">${item.emoji}</div>
                <div class="h-info">
                    <div class="h-name">${item.name}${item.sold ? ' (продан)' : ''}</div>
                    <div class="h-rarity r-${item.rarity}">${RARITY_LABELS[item.rarity]} · ${formatPrice(item.price)} 🪙</div>
                </div>
                <div class="h-time">${item.time}</div>
            </div>
        `).join('');
    }

    // === ИНВЕНТАРЬ ===
    function renderInventory() {
        const grid = document.getElementById('inventoryGrid');
        const count = document.getElementById('invCount');
        const total = document.getElementById('invTotal');

        count.textContent = inventory.length;
        const sum = inventory.reduce((s, it) => s + it.price, 0);
        total.textContent = formatPrice(sum);

        if (inventory.length === 0) {
            grid.innerHTML = '<div class="empty-history" style="grid-column: 1/-1;">Инвентарь пуст — открой кейс</div>';
            return;
        }

        grid.innerHTML = inventory.map((item, index) => `
            <div class="inv-card r-${item.rarity}">
                <span class="inv-emoji">${item.emoji}</span>
                <div class="inv-name">${item.name}</div>
                <div class="inv-rarity r-${item.rarity}">${RARITY_LABELS[item.rarity]}</div>
                <div class="inv-price">${formatPrice(item.price)} 🪙</div>
                <button class="inv-sell" onclick="sellFromInventory(${index})">Продать</button>
            </div>
        `).join('');
    }

    function sellFromInventory(index) {
        const item = inventory[index];
        if (!item) return;
        balance += item.price;
        updateBalance('plus');
        addToHistory({ ...item, sold: true });
        inventory.splice(index, 1);
        renderInventory();
    }

    // === БАЛАНС ===
    function updateBalance(type) {
        const box = document.getElementById('balanceBox');
        const amount = document.getElementById('balanceAmount');
        amount.textContent = formatPrice(balance);
        box.classList.remove('plus', 'minus');
        void box.offsetWidth;
        if (type === 'plus') box.classList.add('plus');
        if (type === 'minus') box.classList.add('minus');
    }

    function shakeBalance() {
        const box = document.getElementById('balanceBox');
        box.classList.remove('minus');
        void box.offsetWidth;
        box.classList.add('minus');
    }

    // === СБРОС ===
    function resetDemo() {
        if (isOpening) return;
        balance = START_BALANCE;
        history = [];
        inventory = [];
        pendingDrop = null;
        updateBalance();
        renderHistory();
        renderInventory();
        resetRoulette();
    }

    // === ИНИЦИАЛИЗАЦИЯ ===
    updateBalance();
    renderCasePicker();
    renderHistory();
    renderInventory();
    resetRoulette();

    // Закрытие по фону
    document.getElementById('dropModal').addEventListener('click', (e) => {
        if (e.target.id === 'dropModal') keepDrop();
    });
</script>
</body>
</html>
