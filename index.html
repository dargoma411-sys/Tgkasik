<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Case Drop — Neon Edition v6</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0416;
  --panel: rgba(20, 10, 40, 0.55);
  --border: rgba(140, 80, 255, 0.35);
  --purple: #a855f7;
  --cyan: #22d3ee;
  --pink: #ec4899;
  --gold: #fbbf24;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --r-common: #9ca3af;
  --r-uncommon: #22c55e;
  --r-rare: #3b82f6;
  --r-epic: #a855f7;
  --r-mythic: #ec4899;
  --r-legendary: #fbbf24;
}
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow-x: hidden;
  user-select: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(168,85,247,0.35) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 10%, rgba(168,85,247,0.18), transparent 40%),
              radial-gradient(circle at 80% 90%, rgba(34,211,238,0.15), transparent 40%);
  pointer-events: none;
  z-index: 0;
}
#app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 12px 12px 90px; }

header.top {
  position: sticky;
  top: 8px;
  z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; margin-bottom: 12px;
  background: linear-gradient(160deg, rgba(30, 15, 60, 0.95), rgba(15, 5, 35, 0.95));
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 8px 32px rgba(168,85,247,0.4), 0 0 0 1px rgba(168,85,247,0.15) inset;
}
.logo { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; background: linear-gradient(90deg, var(--purple), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.balance { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; padding: 6px 12px; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.4); border-radius: 10px; color: var(--gold); }
.balance.shake { animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.faucet-wrap { margin-bottom: 12px; display: none; }
.faucet-wrap.show { display: block; animation: fadeUp 0.4s ease; }
.faucet-btn {
  width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 14px;
  border: none; cursor: pointer; color: #001;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  box-shadow: 0 0 24px rgba(251,191,36,0.6);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  animation: pulseGold 2s infinite;
}
.faucet-btn:disabled { opacity: 0.6; cursor: not-allowed; animation: none; }
@keyframes pulseGold {
  0%,100% { box-shadow: 0 0 24px rgba(251,191,36,0.6); }
  50% { box-shadow: 0 0 40px rgba(251,191,36,0.95); }
}

nav.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 6px; margin-bottom: 14px;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 14px;
  scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: transparent; color: var(--muted); border: none; cursor: pointer;
  transition: all 0.25s; white-space: nowrap;
}
.tab.active { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; box-shadow: 0 0 16px rgba(168,85,247,0.6); }
.tab:not(.active):hover { color: var(--text); background: rgba(168,85,247,0.12); }

.view { display: none; animation: fadeUp 0.35s ease; }
.view.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.panel {
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px;
  box-shadow: 0 0 22px rgba(120,60,220,0.15);
}
h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.4px; }
h2 .accent { color: var(--cyan); }

.cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.case-card {
  position: relative; padding: 14px 12px; border-radius: 14px; cursor: pointer;
  background: linear-gradient(160deg, rgba(60,20,110,0.7), rgba(20,10,40,0.7));
  border: 1px solid var(--border); transition: all 0.25s; overflow: hidden;
}
.case-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 40%, rgba(168,85,247,0.2)); opacity: 0; transition: opacity 0.3s; }
.case-card:hover { transform: translateY(-3px); border-color: var(--purple); box-shadow: 0 8px 26px rgba(168,85,247,0.4); }
.case-card:hover::after { opacity: 1; }
.case-card.selected { border-color: var(--cyan); box-shadow: 0 0 22px rgba(34,211,238,0.55); }
.case-emoji { font-size: 30px; text-align: center; margin-bottom: 6px; filter: drop-shadow(0 0 8px rgba(168,85,247,0.8)); }
.case-name { font-size: 12.5px; font-weight: 700; text-align: center; margin-bottom: 6px; line-height: 1.25; }
.case-price { font-size: 12px; text-align: center; color: var(--gold); font-weight: 700; }

.roulette-wrap { position: relative; padding: 10px 0; margin-bottom: 12px; }
.roulette {
  position: relative; height: 110px; border-radius: 14px; overflow: hidden;
  background: linear-gradient(180deg, rgba(20,10,40,0.9), rgba(40,20,80,0.5));
  border: 1px solid var(--border);
}
.roulette-track {
  position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center;
  transition: transform 7s cubic-bezier(0.10, 0.85, 0.12, 1);
  will-change: transform;
}
.roulette-item {
  flex: 0 0 110px; height: 90px; margin: 0 5px; border-radius: 12px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; padding: 6px;
  background: rgba(20,10,40,0.9); border: 2px solid; position: relative; overflow: hidden;
}
.roulette-item .it-emoji { font-size: 26px; }
.roulette-item .it-name { font-size: 10px; text-align: center; font-weight: 600; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.roulette-item.hype {
  animation: hypePulse 0.5s infinite alternate;
}
@keyframes hypePulse {
  from { filter: brightness(1); }
  to { filter: brightness(1.6) drop-shadow(0 0 12px currentColor); }
}
.roulette-pointer {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--cyan), var(--pink)); box-shadow: 0 0 16px var(--cyan); z-index: 3;
}
.roulette-pointer::before, .roulette-pointer::after {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  border-left: 7px solid transparent; border-right: 7px solid transparent;
}
.roulette-pointer::before { top: -1px; border-top: 8px solid var(--cyan); }
.roulette-pointer::after { bottom: -1px; border-bottom: 8px solid var(--pink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
  border: none; cursor: pointer; transition: all 0.2s; color: #fff;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  box-shadow: 0 4px 16px rgba(168,85,247,0.45);
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(168,85,247,0.7); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.btn.cyan { background: linear-gradient(135deg, var(--cyan), #0891b2); box-shadow: 0 4px 16px rgba(34,211,238,0.45); }
.btn.gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #1a0a2e; box-shadow: 0 4px 16px rgba(251,191,36,0.45); }
.btn.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 16px rgba(239,68,68,0.45); }
.btn.gray { background: rgba(120,120,140,0.3); box-shadow: none; }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.rarity-common { color: var(--r-common); }
.rarity-uncommon { color: var(--r-uncommon); }
.rarity-rare { color: var(--r-rare); }
.rarity-epic { color: var(--r-epic); }
.rarity-mythic { color: var(--r-mythic); }
.rarity-legendary { color: var(--r-legendary); }

.border-common { border-color: var(--r-common) !important; box-shadow: 0 0 10px rgba(156,163,175,0.5); }
.border-uncommon { border-color: var(--r-uncommon) !important; box-shadow: 0 0 10px rgba(34,197,94,0.5); }
.border-rare { border-color: var(--r-rare) !important; box-shadow: 0 0 14px rgba(59,130,246,0.6); }
.border-epic { border-color: var(--r-epic) !important; box-shadow: 0 0 16px rgba(168,85,247,0.65); }
.border-mythic { border-color: var(--r-mythic) !important; box-shadow: 0 0 20px rgba(236,72,153,0.75); }
.border-legendary { border-color: var(--r-legendary) !important; box-shadow: 0 0 24px rgba(251,191,36,0.85); }

.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.item-card {
  padding: 10px; border-radius: 12px; background: rgba(20,10,40,0.75); border: 2px solid;
  display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative;
}
.item-emoji { font-size: 26px; }
.item-name { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.2; }
.item-price { font-size: 11px; color: var(--gold); font-weight: 700; }
.item-rarity { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.item-actions { display: flex; gap: 4px; margin-top: 4px; width: 100%; }
.item-actions .btn { flex: 1; padding: 6px 4px; font-size: 11px; }

.empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 13px; }
.empty-emoji { font-size: 42px; margin-bottom: 8px; opacity: 0.6; }

.history-list { display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
.hist-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 10px; background: rgba(20,10,40,0.7);
  border-left: 3px solid; font-size: 12.5px;
}
.hist-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hist-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-time { font-size: 10px; color: var(--muted); }
.hist-price { color: var(--gold); font-weight: 700; white-space: nowrap; }

.upgrader-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 12px; }
.upg-slot {
  padding: 14px 10px; border-radius: 12px; border: 2px dashed rgba(140,80,255,0.5);
  min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: rgba(20,10,40,0.6); cursor: pointer; transition: all 0.2s;
}
.upg-slot.filled { border-style: solid; }
.upg-slot:hover { border-color: var(--cyan); }
.upg-slot .empty-label { color: var(--muted); font-size: 11px; text-align: center; }
.upg-arrow { font-size: 22px; color: var(--purple); text-align: center; }
.chance-info { text-align: center; padding: 10px; border-radius: 10px; background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.3); margin-bottom: 12px; font-size: 13px; }
.chance-info .big { font-size: 22px; font-weight: 800; color: var(--cyan); }

.wheel-container {
  position: relative;
  width: 220px; height: 220px;
  margin: 20px auto;
  display: none;
}
.wheel-container.show { display: block; }
.wheel {
  width: 100%; height: 100%;
  border-radius: 50%;
  position: relative;
  transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
  background: conic-gradient(
    #ef4444 0deg 330deg,
    #22c55e 330deg 360deg
  );
  box-shadow: 0 0 40px rgba(168,85,247,0.6), inset 0 0 20px rgba(0,0,0,0.6);
  border: 4px solid var(--purple);
}
.wheel-pointer-top {
  position: absolute;
  top: -22px; left: 50%;
  transform: translateX(-50%);
  font-size: 32px;
  color: var(--gold);
  filter: drop-shadow(0 0 10px var(--gold));
  z-index: 5;
}
.wheel-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px;
  color: #fff;
  box-shadow: 0 0 20px rgba(168,85,247,0.9);
  z-index: 3;
}
.wheel-result {
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  padding: 12px;
  border-radius: 12px;
  margin-top: 12px;
  animation: zoomIn 0.4s;
}
.wheel-result.win {
  color: #22c55e;
  background: rgba(34,197,94,0.15);
  border: 1px solid rgba(34,197,94,0.6);
  box-shadow: 0 0 24px rgba(34,197,94,0.5);
}
.wheel-result.lose {
  color: #ef4444;
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.6);
  box-shadow: 0 0 24px rgba(239,68,68,0.5);
}

.item-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px; }
.picker-item {
  padding: 8px; border-radius: 10px; background: rgba(20,10,40,0.8); border: 2px solid;
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: all 0.2s;
}
.picker-item:hover { transform: scale(1.05); }
.picker-item.selected { outline: 3px solid var(--cyan); }
.picker-item .pe { font-size: 22px; }
.picker-item .pn { font-size: 10px; text-align: center; font-weight: 600; line-height: 1.15; }
.picker-item .pp { font-size: 10px; color: var(--gold); font-weight: 700; }

.game-board { display: grid; gap: 6px; margin: 12px auto; }
.board-5 { grid-template-columns: repeat(5, 1fr); max-width: 320px; }
.board-3 { grid-template-columns: repeat(3, 1fr); max-width: 240px; }
.board-4 { grid-template-columns: repeat(4, 1fr); max-width: 280px; }
.cell {
  aspect-ratio: 1; border-radius: 10px; background: linear-gradient(135deg, rgba(60,30,110,0.8), rgba(30,15,60,0.8));
  border: 1px solid rgba(140,80,255,0.4); display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; transition: all 0.15s; font-weight: 700;
}
.cell:hover:not(.revealed) { transform: scale(1.06); border-color: var(--cyan); }
.cell.safe { background: rgba(34,197,94,0.25); border-color: var(--r-uncommon); color: #22c55e; }
.cell.bomb { background: rgba(239,68,68,0.3); border-color: #ef4444; }
.cell.revealed { cursor: default; }

.dice-display { display: flex; justify-content: center; gap: 14px; margin: 20px 0; }
.die {
  width: 72px; height: 72px; border-radius: 14px; background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: #fff;
  box-shadow: 0 0 24px rgba(168,85,247,0.6);
}
.die.rolling { animation: dieRoll 0.4s infinite; }
@keyframes dieRoll { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }

.coin-flip {
  width: 120px; height: 120px; border-radius: 50%; margin: 24px auto;
  background: radial-gradient(circle at 30% 30%, #fde68a, #d97706);
  display: flex; align-items: center; justify-content: center; font-size: 60px;
  box-shadow: 0 0 34px rgba(251,191,36,0.7); transition: transform 0.6s;
}
.coin-flip.flipping { animation: coinSpin 0.6s infinite; }
@keyframes coinSpin { from{transform:rotateY(0)} to{transform:rotateY(360deg)} }

.game-stats { display: flex; justify-content: space-around; padding: 10px; margin-bottom: 12px; border-radius: 10px; background: rgba(20,10,40,0.6); font-size: 12px; }
.game-stats .stat { text-align: center; }
.game-stats .stat .v { font-size: 17px; font-weight: 800; color: var(--cyan); }
.game-stats .stat .l { color: var(--muted); font-size: 10px; margin-top: 2px; }

.bet-panel {
  padding: 10px 12px; border-radius: 12px; background: rgba(20,10,40,0.6);
  border: 1px solid var(--border); margin-bottom: 12px;
}
.bet-panel .bet-current {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.bet-panel .bet-current .lbl { font-size: 12px; color: var(--muted); }
.bet-panel .bet-current .val { font-size: 18px; font-weight: 800; color: var(--gold); }
.bet-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bet-quick button {
  padding: 9px 4px; border-radius: 10px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--border); background: rgba(40,20,80,0.6); color: var(--text);
  cursor: pointer; transition: all 0.15s;
}
.bet-quick button:hover { background: rgba(168,85,247,0.3); border-color: var(--purple); }
.bet-quick button:active { transform: scale(0.95); }
.bet-quick button.max { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #1a0a2e; border: none; }
.bet-quick button.max:hover { filter: brightness(1.1); }

.leaderboard { display: flex; flex-direction: column; gap: 5px; }
.lb-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  background: rgba(20,10,40,0.7); border: 1px solid rgba(140,80,255,0.2); font-size: 13px;
}
.lb-row.me { border-color: var(--cyan); background: rgba(34,211,238,0.1); box-shadow: 0 0 12px rgba(34,211,238,0.3); }
.lb-rank { width: 30px; font-weight: 800; text-align: center; font-size: 14px; }
.lb-rank.gold { color: var(--gold); }
.lb-rank.silver { color: #cbd5e1; }
.lb-rank.bronze { color: #f59e0b; }
.lb-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-bal { color: var(--gold); font-weight: 700; }

.modal-bg {
  position: fixed; inset: 0; background: rgba(5,0,15,0.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal-bg.show { display: flex; animation: fadeIn 0.25s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: linear-gradient(160deg, rgba(40,15,80,0.95), rgba(15,5,35,0.95));
  border: 1px solid var(--border); border-radius: 20px; padding: 22px; max-width: 340px; width: 100%;
  text-align: center; box-shadow: 0 0 40px rgba(168,85,247,0.5);
  animation: zoomIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes zoomIn { from{transform:scale(0.7); opacity:0} to{transform:scale(1); opacity:1} }
.modal .m-emoji { font-size: 58px; margin-bottom: 8px; filter: drop-shadow(0 0 14px currentColor); }
.modal .m-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.modal .m-price { font-size: 15px; color: var(--gold); font-weight: 700; margin-bottom: 14px; }
.modal .m-rarity { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; margin-bottom: 12px; }
.modal .m-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions .btn { flex: 1; }

.popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
  padding: 16px 26px; border-radius: 16px; font-size: 22px; font-weight: 900;
  background: linear-gradient(135deg, rgba(168,85,247,0.95), rgba(236,72,153,0.95));
  color: #fff; z-index: 200; pointer-events: none; opacity: 0;
  box-shadow: 0 0 40px rgba(236,72,153,0.8); white-space: nowrap;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.popup.bad { background: linear-gradient(135deg, rgba(220,38,38,0.95), rgba(120,20,20,0.95)); box-shadow: 0 0 40px rgba(220,38,38,0.8); }

  common:    { name: 'Обычный',    color: '#9ca3af' },
  uncommon:  { name: 'Необычный',  color: '#22c55e' },
  rare:      { name: 'Редкий',     color: '#3b82f6' },

  legendary: { name: 'Легендарный',color: '#fbbf24' }

/* ============ ШАНСЫ ДРОПА v5 ============ */
const RARITY_CHANCE_BASE = {
  common:    0.18,
  uncommon:  0.26,
  rare:      0.28,
  epic:      0.15,
  mythic:    0.09,
  legendary: 0.04
};

function getRarityChances(caseObj) {
  if (!caseObj) return RARITY_CHANCE_BASE;
  const idx = CASES.indexOf(caseObj);
  let boost = 0;
  if (idx >= 40) boost = 0.80;
  else if (idx >= 25) boost = 0.55;
  else if (idx >= 12) boost = 0.30;
  else boost = 0;

  const boosted = {
    common:    RARITY_CHANCE_BASE.common * (1 - boost * 0.5),
    uncommon:  RARITY_CHANCE_BASE.uncommon * (1 - boost * 0.4),
    rare:      RARITY_CHANCE_BASE.rare * (1 + boost * 0.3),
    epic:      RARITY_CHANCE_BASE.epic * (1 + boost * 0.8),
    mythic:    RARITY_CHANCE_BASE.mythic * (1 + boost * 1.2),
    legendary: RARITY_CHANCE_BASE.legendary * (1 + boost * 2.0)
  };
  const sum = Object.values(boosted).reduce((a,b) => a+b, 0);
  const normalized = {};
  for (const k in boosted) normalized[k] = boosted[k] / sum;
  return normalized;
}

const PREFIX = ['Ржавый','Простой','Обычный','Хороший','Крутой','Эпичный','Мифический','Божественный','Абсолютный','Космический','Вневременной','Секретный'];
const NOUNS = {
  common: ['Камень','Хлеб','Скрепка','Носок','Картошка','Кирпич','Газета','Банка'],
  uncommon: ['Клевер','Кристалл','Зелье','Батарейка','Шарик','Лёд','Медаль','Значок'],
  rare: ['Алмаз','Сапфир','Волна','Снежинка','Щит','Перстень','Кубок','Амулет'],
  epic: ['Сфера','Осколок','Галактика','Единорог','Талисман','Молния','Кубок','Артефакт'],
  mythic: ['Сердце','Цветок','Бант','Корона','Пламя','Перо','Крыло','Реликвия'],
  legendary: ['Корона','Трофей','Скипетр','Звезда','Сияние','Лев','Трезубец','Трон']
};

function seededRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function generateCaseItems(caseObj, idx) {
  const items = [];
  const rarities = Object.keys(RARITY);
  const price = caseObj.price;
  const counts = { common: 3, uncommon: 3, rare: 2, epic: 2, mythic: 1, legendary: 1 };
  let s = idx * 1000 + caseObj.id.length * 7;
  rarities.forEach(r => {
    const n = counts[r];
    for (let i = 0; i < n; i++) {
      s += 1;
      const rnd = seededRandom(s);
      const rnd2 = seededRandom(s + 0.5);
      const mult = { common: 0.3, uncommon: 0.7, rare: 1.8, epic: 4, mythic: 12, legendary: 40 }[r];
      const variance = 0.6 + rnd2 * 0.9;
      const itemPrice = Math.max(1, Math.round(price * mult * variance));
      const noun = NOUNS[r][Math.floor(rnd * NOUNS[r].length)];
      const pref = PREFIX[Math.floor(seededRandom(s + 2) * PREFIX.length)];
      const emoji = EMOJIS[r][Math.floor(seededRandom(s + 3) * EMOJIS[r].length)];
      const name = `${pref} ${noun}`;
      items.push({ id: `${caseObj.id}_${r}_${i}`, name, emoji, price: itemPrice, rarity: r });
    }
  });
  return items;
}

CASES.forEach((c, i) => { c.items = generateCaseItems(c, i); });

function fmt(n) {
  if (n >= 1e15) return (n/1e15).toFixed(2) + 'Q';
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(2) + 'K';
  return Math.round(n).toString();
}
function fmtFull(n) { return Math.round(n).toLocaleString('ru-RU'); }
function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }

let toastTimer;
function toast(msg, type='') {

}

/* ============ FAUCET ============ */
const FAUCET_COOLDOWN = 60 * 1000;

function updateFaucet() {
  const wrap = $('#faucetWrap');
  const btn = $('#faucetBtn');
  if (state.balance >= 500) { wrap.classList.remove('show'); return; }
  wrap.classList.add('show');
  const now = Date.now();
  const elapsed = now - (state.lastFaucetTime || 0);
  if (elapsed >= FAUCET_COOLDOWN) {
    btn.disabled = false;
    btn.textContent = '🎁 Получить 1000 монет';
  } else {
    const left = Math.ceil((FAUCET_COOLDOWN - elapsed) / 1000);
    btn.disabled = true;
    btn.textContent = `⏳ Подожди ${left} сек`;
  }
}
setInterval(updateFaucet, 1000);

$('#faucetBtn').onclick = () => {
  if (state.balance >= 500) { toast('Кнопка доступна только при балансе < 500', 'bad'); return; }
  const now = Date.now();
  if (now - (state.lastFaucetTime || 0) < FAUCET_COOLDOWN) { toast('Подожди ещё немного', 'bad'); return; }
  state.balance += 1000;
  state.lastFaucetTime = now;
  save(); updateBalance(); shakeBalance();
  popup('+1000', false);
  toast('Получено 1000 монет!', 'good');
};

/* ============ RARITY ROLL ============ */
function rollRarity(caseObj) {
  const chances = getRarityChances(caseObj);
  const r = Math.random();
  let acc = 0;
  const order = ['common','uncommon','rare','epic','mythic','legendary'];
  for (const k of order) {
    acc += chances[k];
    if (r < acc) return k;
  }
  return 'legendary';
}

function rollItem(caseObj) {
  let rarity = rollRarity(caseObj);
  let pool = caseObj.items.filter(i => i.rarity === rarity);
  if (!pool.length) pool = caseObj.items;
  return pool[Math.floor(Math.random() * pool.length)];
}

function rollHypeItem(caseObj) {
  const hypePool = caseObj.items.filter(i => i.rarity === 'epic' || i.rarity === 'mythic' || i.rarity === 'legendary');
  if (!hypePool.length) return null;
  const weighted = [];
  hypePool.forEach(it => {
    const w = it.rarity === 'legendary' ? 1 : it.rarity === 'mythic' ? 3 : 6;
    for (let i = 0; i < w; i++) weighted.push(it);
  });
  return weighted[Math.floor(Math.random() * weighted.length)];
}

/* ============ ROULETTE ============ */
let opening = false;

async function openCases(count) {
  if (opening) return;
  const c = CASES.find(x => x.id === state.selectedCase);
  if (!c) return;
  const cost = c.price * count;
  if (state.balance < cost) { toast('Недостаточно монет', 'bad'); return; }
  opening = true;
  state.balance -= cost;
  save();
  updateBalance(); updateOpenButtons();

  const track = $('#rouletteTrack');
  const items = [];
  const ITEM_W = 120;
  const totalStrip = 60;

  for (let i = 0; i < totalStrip; i++) items.push(rollItem(c));

  const hypeCount = 6 + Math.floor(Math.random() * 4);
  const hypePositions = new Set();
  while (hypePositions.size < hypeCount) {
    const pos = 5 + Math.floor(Math.random() * (totalStrip - 15));
    hypePositions.add(pos);
  }

  const winIndex = 50;
  hypePositions.delete(winIndex);
  hypePositions.delete(winIndex + 1);
  hypePositions.delete(winIndex - 1);
  hypePositions.delete(winIndex + 2);

  const winners = [];
  for (let i = 0; i < count; i++) winners.push(rollItem(c));
  items[winIndex] = winners[0];
  items[winIndex + 2] = winners[1 % count] || winners[0];

  hypePositions.forEach(pos => {
    const hype = rollHypeItem(c);
    if (hype) items[pos] = hype;
  });

  track.style.transition = 'none';
  track.style.transform = 'translateX(0px)';
  track.innerHTML = items.map((it, i) => {
    const isHype = hypePositions.has(i);
    return `<div class="roulette-item border-${it.rarity}${isHype ? ' hype' : ''}">
      <div class="it-emoji">${it.emoji}</div>
      <div class="it-name rarity-${it.rarity}">${it.name}</div>
    </div>`;
  }).join('');

  const container = track.parentElement;
  const containerW = container.clientWidth;
  const targetX = -(winIndex * ITEM_W + ITEM_W/2 - containerW/2);

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  track.style.transition = 'transform 7s cubic-bezier(0.10, 0.85, 0.12, 1)';
  track.style.transform = `translateX(${targetX}px)`;

  await new Promise(r => setTimeout(r, 7000));

  let totalWin = 0;
  winners.forEach(w => {
    const uid = 'i' + Date.now() + Math.random().toString(36).slice(2,6);
    state.inventory.push({ ...w, uid });
    state.history.unshift({ name: w.name, emoji: w.emoji, price: w.price, rarity: w.rarity, time: Date.now() });
    totalWin += w.price;
  });
  if (state.history.length > 40) state.history.length = 40;
  save();

  showItemModal(winners[winners.length-1], count === 1 ? false : true, winners);
  popup(GOOD_POPUPS[Math.floor(Math.random()*GOOD_POPUPS.length)], false);

  opening = false;
  renderInventory(); renderHistory(); updateBalance(); updateOpenButtons();
}

/* ============ UPGRADER ============ */
let upgLeft = null, upgRight = null;
let wheelSpinning = false;

function calcUpgradeChance(leftPrice, rightPrice) {
  if (!leftPrice || !rightPrice || leftPrice >= rightPrice) return 0;
  const ratio = leftPrice / rightPrice;
  let chance = Math.pow(ratio, 1.1) * 1.15;
  if (ratio > 0.05) chance = Math.max(chance, 0.12);
  return Math.min(0.90, chance);
}

function renderUpgrader() {
  const L = $('#upgLeft'), R = $('#upgRight');
  if (upgLeft) {
    L.className = 'upg-slot filled border-' + upgLeft.rarity;
    L.innerHTML = `<div class="item-emoji">${upgLeft.emoji}</div>
      <div class="item-name rarity-${upgLeft.rarity}">${upgLeft.name}</div>
      <div class="item-price">💰 ${fmt(upgLeft.price)}</div>`;
  } else {
    L.className = 'upg-slot';
    L.innerHTML = '<div class="empty-label">Выбери<br>свой предмет</div>';
  }
  if (upgRight) {
    R.className = 'upg-slot filled border-' + upgRight.rarity;
    R.innerHTML = `<div class="item-emoji">${upgRight.emoji}</div>
      <div class="item-name rarity-${upgRight.rarity}">${upgRight.name}</div>
      <div class="item-price">💰 ${fmt(upgRight.price)}</div>`;
  } else {
    R.className = 'upg-slot';
    R.innerHTML = '<div class="empty-label">Выбери<br>цель</div>';
  }
  const chance = (upgLeft && upgRight) ? calcUpgradeChance(upgLeft.price, upgRight.price) : 0;
  $('#upgChance').innerHTML = `Шанс: <span class="big">${(chance*100).toFixed(2)}%</span>`;
  $('#upgBtn').disabled = !(upgLeft && upgRight && upgLeft.price < upgRight.price) || wheelSpinning;
}

function pickFromInventory(cb) {
  $('#pickTitle').textContent = 'Выбери свой предмет';
  const list = $('#pickList');
  if (!state.inventory.length) {
    list.innerHTML = '<div class="empty" style="grid-column:1/-1">Инвентарь пуст</div>';
  } else {
    list.innerHTML = state.inventory.map(it => `
      <div class="picker-item border-${it.rarity}" data-uid="${it.uid}">
        <div class="pe">${it.emoji}</div>
        <div class="pn rarity-${it.rarity}">${it.name}</div>
        <div class="pp">${fmt(it.price)}</div>
      </div>
    `).join('');
    list.querySelectorAll('.picker-item').forEach(el => {
      el.onclick = () => {
        const it = state.inventory.find(x => x.uid === el.dataset.uid);
        $('#pickModal').classList.remove('show');
        if (it) cb(it);
      };
    });
  }
  $('#pickModal').classList.add('show');
}

function pickTarget(cb) {
  const all = [];
  CASES.forEach(c => c.items.forEach(it => all.push(it)));
  const seen = new Set();
  const uniq = [];
  all.forEach(it => { const k = it.name+it.price; if (!seen.has(k)) { seen.add(k); uniq.push(it); }});
  uniq.sort((a,b) => a.price - b.price);
  $('#pickTitle').textContent = 'Выбери цель';
  const list = $('#pickList');
  list.innerHTML = uniq.map((it, i) => `
    <div class="picker-item border-${it.rarity}" data-i="${i}">
      <div class="pe">${it.emoji}</div>
      <div class="pn rarity-${it.rarity}">${it.name}</div>
      <div class="pp">${fmt(it.price)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.picker-item').forEach(el => {
    el.onclick = () => {
      const it = uniq[+el.dataset.i];
      $('#pickModal').classList.remove('show');
      cb(it);
    };
  });
  $('#pickModal').classList.add('show');
}

$('#pickCancel').onclick = () => $('#pickModal').classList.remove('show');
$('#upgLeft').onclick = () => { if (wheelSpinning) return; pickFromInventory(it => { upgLeft = it; renderUpgrader(); }); };
$('#upgRight').onclick = () => { if (wheelSpinning) return; pickTarget(it => { upgRight = it; renderUpgrader(); }); };
$('#upgClearL').onclick = () => { if (wheelSpinning) return; upgLeft = null; renderUpgrader(); };
$('#upgClearR').onclick = () => { if (wheelSpinning) return; upgRight = null; renderUpgrader(); };

$('#upgBtn').onclick = () => {
  if (wheelSpinning) return;
  if (!upgLeft || !upgRight) return;
  const chance = calcUpgradeChance(upgLeft.price, upgRight.price);
  const success = Math.random() < chance;
  wheelSpinning = true;
  $('#upgBtn').disabled = true;

  const wheel = $('#wheel');
  const wheelContainer = $('#wheelContainer');
  const wheelResult = $('#wheelResult');
  wheelResult.innerHTML = '';
  wheelContainer.classList.add('show');

  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';

  const greenStart = 330, greenEnd = 360;
  const redStart = 0, redEnd = 330;

  const targetAngleInside = success
    ? greenStart + Math.random() * (greenEnd - greenStart)
    : redStart + Math.random() * (redEnd - redStart);

  const fullSpins = 5 + Math.floor(Math.random() * 4);
  const rotation = 360 * fullSpins + (360 - targetAngleInside);

  requestAnimationFrame(() => {
    wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
    wheel.style.transform = `rotate(${rotation}deg)`;
  });

  setTimeout(() => {
    const idx = state.inventory.findIndex(x => x.uid === upgLeft.uid);
    if (idx !== -1) state.inventory.splice(idx, 1);

    if (success) {
      const newItem = { ...upgRight, uid: 'u' + Date.now() + Math.random().toString(36).slice(2,6) };
      state.inventory.push(newItem);
      state.history.unshift({ name: newItem.name, emoji: newItem.emoji, price: newItem.price, rarity: newItem.rarity, time: Date.now() });
      if (state.history.length > 40) state.history.length = 40;
      popup('УСПЕХ! 🎉', false);
      toast(`🎉 Апгрейд успешен! Получен ${newItem.name}`, 'good');
      wheelResult.innerHTML = `<div class="wheel-result win">✅ УСПЕХ! +${newItem.name}</div>`;
      shakeBalance();
    } else {
      popup('ПРОВАЛ 💀', true);
      toast('Апгрейд провален — предмет потерян', 'bad');
      wheelResult.innerHTML = `<div class="wheel-result lose">❌ ПРОВАЛ</div>`;
    }

    upgLeft = null; upgRight = null;
    wheelSpinning = false;
    save(); renderUpgrader(); renderInventory(); renderHistory(); updateBalance();

    setTimeout(() => {
      wheelContainer.classList.remove('show');
      wheelResult.innerHTML = '';
    }, 2500);
  }, 4200);
};

function bindBetPanel(inputId, onChange) {
  const panel = document.querySelector(`.bet-quick[data-target="${inputId}"]`);
  if (!panel) return;
  panel.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const pct = Number(btn.dataset.pct) / 100;
      const bet = Math.max(1, Math.floor(state.balance * pct));
      if (bet <= 0) { toast('Недостаточно монет', 'bad'); return; }
      if (onChange) onChange(bet);
    };

/* --- MINES --- */
function startMines(size, mines) {
  const totalCells = size * size;
  const mineSet = new Set();
  while (mineSet.size < mines) mineSet.add(Math.floor(Math.random() * totalCells));
  let revealed = 0, multiplier = 1, bet = Math.max(1, Math.min(10, state.balance));
  let playing = false, over = false;
  const safeTotal = totalCells - mines;

  function draw() {
    const cellsHtml = Array.from({length: totalCells}, (_, i) => `<div class="cell" data-i="${i}"></div>`).join('');
    gamePanel(`
      <h2>💣 Сапёр ${size}×${size}</h2>
      <div class="game-stats">
        <div class="stat"><div class="v" id="mMult">×${multiplier.toFixed(2)}</div><div class="l">Множитель</div></div>
        <div class="stat"><div class="v" id="mSafe">${revealed}/${safeTotal}</div><div class="l">Открыто</div></div>
        <div class="stat"><div class="v" id="mWin">${fmt(Math.round(bet * multiplier))}</div><div class="l">Выигрыш</div></div>
      </div>
      ${betPanelHTML('mBet', bet)}
      <div class="game-board board-${size}" id="mBoard">${cellsHtml}</div>
      <button class="btn" id="mCash" style="width:100%;margin-top:10px" disabled>💰 Забрать</button>
    `);
    $('#mBoard').querySelectorAll('.cell').forEach(cell => {
      cell.onclick = () => clickCell(+cell.dataset.i, cell);
    });
    $('#mCash').onclick = cashOut;
    bindBetPanel('mBet', (newBet) => {
      bet = newBet;
      $('#mBet_val').textContent = '💰 ' + fmt(bet);
      $('#mWin').textContent = fmt(Math.round(bet * multiplier));
    });
  }

  function updateStats() {
    const el = $('#mMult'); if (el) el.textContent = '×' + multiplier.toFixed(2);
    const s = $('#mSafe'); if (s) s.textContent = revealed + '/' + safeTotal;
    const w = $('#mWin'); if (w) w.textContent = fmt(Math.round(bet * multiplier));
  }

  function clickCell(i, cell) {
    if (over || cell.classList.contains('revealed')) return;
    if (!playing) {
      if (state.balance < bet) { toast('Недостаточно монет', 'bad'); return; }
      state.balance -= bet; save(); updateBalance();
      playing = true;
    }
    if (mineSet.has(i)) {
      cell.classList.add('revealed', 'bomb'); cell.textContent = '💣';
      over = true;
      $('#mBoard').querySelectorAll('.cell').forEach((c, idx) => {
        if (mineSet.has(idx) && !c.classList.contains('revealed')) { c.classList.add('revealed','bomb'); c.textContent='💣'; }
      });
      popup('БУМ 💥', true);
      toast('Ты подорвался!', 'bad');
      setTimeout(draw, 1200);
      return;
    }
    cell.classList.add('revealed', 'safe'); cell.textContent = '✅';
    revealed++;
    multiplier = Math.pow(safeTotal / (safeTotal - revealed + 1), 1) * 0.95;
    multiplier = Math.max(1.02, multiplier * 1.05);
    updateStats();
    $('#mCash').disabled = false;
    if (revealed >= safeTotal) cashOut();
  }

  function cashOut() {
    if (!playing || over) return;
    const win = Math.round(bet * multiplier);
    state.balance += win;
    save(); updateBalance(); shakeBalance();
    state.history.unshift({ name: `Сапёр x${multiplier.toFixed(2)}`, emoji: '💣', price: win, rarity: win > bet*3 ? 'legendary' : 'epic', time: Date.now() });
    if (state.history.length > 40) state.history.length = 40;
    save(); renderHistory();
    popup('+ ' + fmt(win), false);
    over = true;
    setTimeout(draw, 800);
  }

  draw();
}

/* --- DICE --- */
function startDice() {
  let bet = Math.max(1, Math.min(10, state.balance));

  function draw(d1='?', d2='?', rolling=false, msg='') {
    gamePanel(`
      <h2>🎲 Кости</h2>
      <div class="dice-display">
        <div class="die ${rolling?'rolling':''}">${d1}</div>
        <div class="die ${rolling?'rolling':''}">${d2}</div>
      </div>
      ${msg ? `<div class="chance-info">${msg}</div>` : ''}
      ${betPanelHTML('dBet', bet)}
      <div class="btn-row">
        <button class="btn cyan" data-pick="low">Меньше 7 (×2)</button>
        <button class="btn gold" data-pick="seven">Ровно 7 (×5)</button>
        <button class="btn cyan" data-pick="high">Больше 7 (×1.9)</button>
      </div>
    `);
    $$('#gamePanel [data-pick]').forEach(b => {
      b.onclick = () => roll(b.dataset.pick);
    });
    bindBetPanel('dBet', (newBet) => {
      bet = newBet;
      $('#dBet_val').textContent = '💰 ' + fmt(bet);
    });
  }

  function roll(pick) {
    if (state.balance < bet) { toast('Недостаточно монет', 'bad'); return; }
    state.balance -= bet; save(); updateBalance();
    let ticks = 0;
    const iv = setInterval(() => {
      draw(1+Math.floor(Math.random()*6), 1+Math.floor(Math.random()*6), true);
      ticks++;
      if (ticks > 12) {
        clearInterval(iv);
        const a = 1+Math.floor(Math.random()*6), b = 1+Math.floor(Math.random()*6);
        const sum = a + b;
        let mult = 0, win = false;
        if (pick === 'low' && sum < 7) { mult = 2; win = true; }
        else if (pick === 'seven' && sum === 7) { mult = 5; win = true; }
        else if (pick === 'high' && sum > 7) { mult = 1.9; win = true; }
        let msg;
        if (win) {
          const w = Math.round(bet * mult);
          state.balance += w;
          state.history.unshift({ name: `Кости ${a}+${b}`, emoji: '🎲', price: w, rarity: 'epic', time: Date.now() });
          if (state.history.length > 40) state.history.length = 40;
          msg = `Выпало ${sum} — выигрыш +${fmt(w)} 🎉`;
          popup('+ ' + fmt(w), false);
          shakeBalance();
        } else {
          msg = `Выпало ${sum} — ты проиграл 😢`;
          popup(BAD_POPUPS[Math.floor(Math.random()*BAD_POPUPS.length)], true);
        }
        save(); updateBalance(); renderHistory();
        draw(a, b, false, msg);
      }
    }, 90);
  }

  draw();
}

/* --- COIN --- */
function startCoin() {
  let bet = Math.max(1, Math.min(10, state.balance));
  let busy = false;

  function draw(face='?', flipping=false, msg='') {
    gamePanel(`
      <h2>🪙 Монетка</h2>
      <div class="coin-flip ${flipping?'flipping':''}">${flipping ? '🪙' : face}</div>
      ${msg ? `<div class="chance-info">${msg}</div>` : ''}
      ${betPanelHTML('cBet', bet)}
      <div class="btn-row">
        <button class="btn cyan" data-side="heads" ${busy?'disabled':''}>Орёл (×1.95)</button>
        <button class="btn gold" data-side="tails" ${busy?'disabled':''}>Решка (×1.95)</button>
      </div>
    `);
    $$('#gamePanel [data-side]').forEach(b => {
      b.onclick = () => flip(b.dataset.side);
    });
    bindBetPanel('cBet', (newBet) => {
      bet = newBet;
      $('#cBet_val').textContent = '💰 ' + fmt(bet);
    });
  }

  function flip(pick) {
    if (busy) return;
    if (state.balance < bet) { toast('Недостаточно монет', 'bad'); return; }
    busy = true;
    state.balance -= bet;
    save(); updateBalance();
    draw('?', true);

    setTimeout(() => {
      const result = Math.random() < 0.5 ? 'heads' : 'tails';
      const face = result === 'heads' ? '👑' : '⭐';
      let msg;
      if (result === pick) {
        const w = Math.round(bet * 1.95);
        state.balance += w;
        state.history.unshift({ name: `Монетка ${result==='heads'?'орёл':'решка'}`, emoji: '🪙', price: w, rarity: 'epic', time: Date.now() });
        if (state.history.length > 40) state.history.length = 40;
        save();
        msg = `✅ Выигрыш +${fmt(w)} 🎉`;
        popup('+ ' + fmt(w), false);
        shakeBalance();
      } else {
        msg = '❌ Проиграл 💀';
        popup(BAD_POPUPS[Math.floor(Math.random()*BAD_POPUPS.length)], true);
      }
      busy = false;
      updateBalance();
      renderHistory();
      draw(face, false, msg);
    }, 900);
  }

  draw();
}

function adminGetStateFor(tgId) {
  if (tgId === userId) {
    return {
      ref: state,
      saveFn: () => { save(); updateBalance(); renderInventory(); shakeBalance(); },
      exists: true
    };
  }
  const key = 'casedrop_' + tgId;
  let st;
  try {
    const raw = localStorage.getItem(key);
    st = raw ? JSON.parse(raw) : null;
  } catch(e) { st = null; }
  if (!st) {
    st = { balance: 1000, inventory: [], history: [], selectedCase: null, lastRewardDate: '', lastFaucetTime: 0 };
  }
  if (typeof st.balance !== 'number') st.balance = 1000;
  if (!Array.isArray(st.inventory)) st.inventory = [];
  if (!Array.isArray(st.history)) st.history = [];
  if (typeof st.lastFaucetTime !== 'number') st.lastFaucetTime = 0;
  if (typeof st.lastRewardDate !== 'string') st.lastRewardDate = '';

  return {
    ref: st,
    saveFn: () => { try { localStorage.setItem(key, JSON.stringify(st)); } catch(e) {} },
    exists: true
  };
}

function adminListPlayers() {
  const players = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('casedrop_') && key !== ADMIN_LOG_KEY) {
        const tgId = key.replace('casedrop_', '');
        try {
          const st = JSON.parse(localStorage.getItem(key));
          players.push({
            id: tgId,
            balance: st.balance || 0,
            items: (st.inventory || []).length,
            isMe: tgId === userId
          });
        } catch(e) {}
      }
    }
  } catch(e) {}
  if (!players.find(p => p.isMe)) {
    players.push({ id: userId, balance: state.balance, items: state.inventory.length, isMe: true });
  }
  return players.sort((a, b) => b.balance - a.balance);
}

        <h3>👥 Игроки в этом localStorage <span class="badge">${players.length}</span></h3>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Нажми на игрока, чтобы подставить ID в поля</div>
        <div class="players-list">
          ${players.map(p => `
            <div class="player-row" data-pid="${p.id}">
              <span class="pid">${p.id}${p.isMe ? ' (ты)' : ''}</span>
              <span>🎒 ${p.items}</span>
              <span class="pbal">💰 ${fmt(p.balance)}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="admin-card">
        <h3>🗑 Управление игроком</h3>
        <input class="admin-input" id="admManageId" placeholder="Telegram ID игрока" value="${userId}">
        <div class="btn-row">
          <button class="btn danger" id="admClearInv" style="flex:1">🗑 Очистить инвентарь</button>
          <button class="btn danger" id="admClearHist" style="flex:1">🗑 Очистить историю</button>
        </div>
        <button class="btn danger" id="admFullReset" style="width:100%;margin-top:8px">💥 ПОЛНЫЙ СБРОС ИГРОКА</button>
      </div>

      <div class="admin-card">
        <h3>📋 Экспорт / Импорт JSON</h3>
        <input class="admin-input" id="admExportId" placeholder="TG ID" value="${userId}">
        <div class="btn-row">
          <button class="btn cyan" id="admExportBtn" style="flex:1">📤 Экспорт</button>
          <button class="btn" id="admImportBtn" style="flex:1">📥 Импорт</button>
        </div>
        <textarea class="admin-input" id="admJsonArea" rows="4" placeholder="JSON состояния" style="margin-top:8px;font-family:monospace;font-size:11px"></textarea>
      </div>
    </div>

    <div class="admin-section" data-asec="mass">
      <div class="admin-card">
        <h3>📢 Массовая выдача монет</h3>
        <input class="admin-input" id="admMassAmount" type="number" placeholder="Сумма каждому" value="1000000">
        <button class="btn gold" id="admMassAdd" style="width:100%">📢 Выдать всем игрокам</button>
        <button class="btn danger" id="admMassRem" style="width:100%;margin-top:8px">📢 Убрать у всех</button>
      </div>

      <div class="admin-card">
        <h3>💥 Опасные операции</h3>
        <button class="btn danger" id="admMassResetAll" style="width:100%">💥 Сбросить ВСЕХ игроков</button>
        <button class="btn danger" id="admDeleteOthers" style="width:100%;margin-top:8px">🗑 Удалить всех кроме себя</button>
      </div>

      <div class="admin-card">
        <h3>🎁 Массовый подарок</h3>
        <select class="admin-input" id="admMassGiftSelect"></select>
        <button class="btn gold" id="admMassGift" style="width:100%">🎁 Выдать всем игрокам</button>
      </div>
    </div>

    <div class="admin-section" data-asec="log">
      <div class="admin-card">
        <h3>📜 Журнал действий <span class="badge">${adminLog.length}</span></h3>
        <div class="log-list" id="adminLogList"></div>
        <button class="btn gray" id="admClearLog" style="width:100%;margin-top:8px">🗑 Очистить лог</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.admin-tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.admin-section').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.querySelector(`.admin-section[data-asec="${t.dataset.atab}"]`).classList.add('active');
    };
  });

  document.querySelectorAll('[data-quick]').forEach(b => {
    b.onclick = () => {
      const amt = document.getElementById('admAmount');
      amt.value = Number(b.dataset.quick);
    };
  });

  document.querySelectorAll('.player-row').forEach(row => {
    row.onclick = () => {
      const pid = row.dataset.pid;
      ['admTgId','admGiftId','admPackId','admCaseId','admManageId','admExportId'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = pid;
      });
      toast(`ID ${pid} подставлен во все поля`, 'good');
    };
  });

  let selectedRarity = 'all';

  function rebuildGiftSelect() {
    const sel = document.getElementById('admGiftSelect');
    if (!sel) return;
    const filtered = selectedRarity === 'all'
      ? uniqItems
      : uniqItems.filter(it => it.rarity === selectedRarity);
    sel.innerHTML = filtered.length
      ? filtered.map((it, i) => `<option value="${uniqItems.indexOf(it)}">${it.emoji} ${it.name} — 💰 ${fmt(it.price)} [${RARITY[it.rarity].name}]</option>`).join('')
      : '<option value="">— нет предметов —</option>';
  }

  function rebuildMassGiftSelect() {
    const sel = document.getElementById('admMassGiftSelect');
    if (!sel) return;
    sel.innerHTML = uniqItems
      .slice()
      .sort((a,b) => a.price - b.price)
      .map((it, i) => `<option value="${uniqItems.indexOf(it)}">${it.emoji} ${it.name} — 💰 ${fmt(it.price)} [${RARITY[it.rarity].name}]</option>`)
      .join('');
  }

  document.querySelectorAll('.rarity-chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('.rarity-chip').forEach(x => x.classList.remove('active'));
      chip.classList.add('active');
      selectedRarity = chip.dataset.r;
      rebuildGiftSelect();
    };
  });

  rebuildGiftSelect();
  rebuildMassGiftSelect();
  renderLogList();

  document.getElementById('admAddBtn').onclick = () => {
    const id = document.getElementById('admTgId').value.trim();
    const sum = Math.max(0, Math.floor(Number(document.getElementById('admAmount').value) || 0));
    if (!id || !sum) return toast('Заполни ID и сумму', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    ref.balance = (ref.balance || 0) + sum;
    saveFn();
    toast(`✅ +${fmtFull(sum)} → ${id}`, 'good');
    popup('+ ' + fmt(sum), false);
    adminLogAdd(`+${fmtFull(sum)} → ${id}`, 'ok');
  };

  document.getElementById('admRemBtn').onclick = () => {
    const id = document.getElementById('admTgId').value.trim();
    const sum = Math.max(0, Math.floor(Number(document.getElementById('admAmount').value) || 0));
    if (!id || !sum) return toast('Заполни ID и сумму', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    ref.balance = Math.max(0, (ref.balance || 0) - sum);
    saveFn();
    toast(`✅ −${fmtFull(sum)} → ${id}`, 'good');
    adminLogAdd(`−${fmtFull(sum)} → ${id}`, 'ok');
  };

  document.getElementById('admSetBtn').onclick = () => {
    const id = document.getElementById('admTgId').value.trim();
    const sum = Math.max(0, Math.floor(Number(document.getElementById('admAmount').value) || 0));
    if (!id) return toast('Укажи ID', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    ref.balance = sum;
    saveFn();
    toast(`🎯 Баланс ${id} = ${fmtFull(sum)}`, 'good');
    adminLogAdd(`set balance ${id} = ${fmtFull(sum)}`, 'ok');
  };

  document.getElementById('admZeroBtn').onclick = () => {
    const id = document.getElementById('admTgId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    if (!confirm(`Обнулить баланс ${id}?`)) return;
    const { ref, saveFn } = adminGetStateFor(id);
    ref.balance = 0;
    saveFn();
    toast(`0️⃣ Баланс ${id} обнулён`, 'good');
    adminLogAdd(`zero balance ${id}`, 'ok');
  };

  document.getElementById('admCheckBtn').onclick = () => {
    const id = document.getElementById('admTgId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    const { ref } = adminGetStateFor(id);
    const items = ref.inventory || [];
    const totalValue = items.reduce((s, i) => s + (i.price || 0), 0);
    const lastHist = (ref.history || [])[0];
    const lastTime = lastHist ? new Date(lastHist.time).toLocaleString('ru-RU') : '—';
    document.getElementById('admPlayerInfo').innerHTML = `
      <div class="admin-stat-grid">
        <div class="admin-stat"><div class="l">ID</div><div class="v">${id}</div></div>
        <div class="admin-stat"><div class="l">Баланс</div><div class="v">💰 ${fmt(ref.balance || 0)}</div></div>
        <div class="admin-stat"><div class="l">Предметов</div><div class="v">🎒 ${items.length}</div></div>
        <div class="admin-stat"><div class="l">Стоимость</div><div class="v">💰 ${fmt(totalValue)}</div></div>
        <div class="admin-stat" style="grid-column:1/-1"><div class="l">Последнее действие</div><div class="v" style="font-size:12px">${lastTime}</div></div>
      </div>
    `;
  };

  document.getElementById('admGiftBtn').onclick = () => {
    const id = document.getElementById('admGiftId').value.trim();
    const idx = Number(document.getElementById('admGiftSelect').value);
    const it = uniqItems[idx];
    if (!id || !it) return toast('Заполни поля', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    const uid = 'a' + Date.now() + Math.random().toString(36).slice(2,6);
    ref.inventory.push({ ...it, uid });
    ref.history.unshift({ name: it.name, emoji: it.emoji, price: it.price, rarity: it.rarity, time: Date.now() });
    if (ref.history.length > 40) ref.history.length = 40;
    saveFn();
    toast(`🎁 ${it.name} → ${id}`, 'good');
    popup('🎁 Выдано!', false);
    adminLogAdd(`gift ${it.name} → ${id}`, 'ok');
  };

  document.getElementById('admPackBtn').onclick = () => {
    const id = document.getElementById('admPackId').value.trim();
    const rarity = document.getElementById('admPackRarity').value;
    const count = Math.max(1, Math.min(100, parseInt(document.getElementById('admPackCount').value) || 1));
    if (!id) return toast('Укажи ID', 'bad');
    const pool = rarity === 'random'
      ? uniqItems
      : uniqItems.filter(it => it.rarity === rarity);
    if (!pool.length) return toast('Нет предметов этой редкости', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    for (let i = 0; i < count; i++) {
      const it = pool[Math.floor(Math.random() * pool.length)];
      const uid = 'p' + Date.now() + i + Math.random().toString(36).slice(2,5);
      ref.inventory.push({ ...it, uid });
      ref.history.unshift({ name: it.name, emoji: it.emoji, price: it.price, rarity: it.rarity, time: Date.now() });
    }
    if (ref.history.length > 40) ref.history.length = 40;
    saveFn();
    toast(`🎲 Выдано ${count} предметов → ${id}`, 'good');
    adminLogAdd(`pack x${count} [${rarity}] → ${id}`, 'ok');
  };

  document.getElementById('admCaseBtn').onclick = () => {
    const id = document.getElementById('admCaseId').value.trim();
    const caseIdx = Number(document.getElementById('admCaseSelect').value);
    const cs = CASES[caseIdx];
    if (!id || !cs) return toast('Заполни поля', 'bad');
    const { ref, saveFn } = adminGetStateFor(id);
    cs.items.forEach(it => {
      const uid = 'c' + Date.now() + Math.random().toString(36).slice(2,6);
      ref.inventory.push({ ...it, uid });
    });
    ref.history.unshift({ name: `Весь кейс ${cs.name}`, emoji: cs.emoji, price: cs.items.reduce((s,i)=>s+i.price,0), rarity: 'legendary', time: Date.now() });
    if (ref.history.length > 40) ref.history.length = 40;
    saveFn();
    toast(`📦 Весь кейс ${cs.name} → ${id}`, 'good');
    adminLogAdd(`full case ${cs.name} → ${id}`, 'ok');
  };

  document.getElementById('admClearInv').onclick = () => {
    const id = document.getElementById('admManageId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    if (!confirm(`Очистить инвентарь ${id}?`)) return;
    const { ref, saveFn } = adminGetStateFor(id);
    ref.inventory = [];
    saveFn();
    toast(`🗑 Инвентарь ${id} очищен`, 'good');
    adminLogAdd(`clear inventory ${id}`, 'ok');
  };

  document.getElementById('admClearHist').onclick = () => {
    const id = document.getElementById('admManageId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    if (!confirm(`Очистить историю ${id}?`)) return;
    const { ref, saveFn } = adminGetStateFor(id);
    ref.history = [];
    saveFn();
    toast(`🗑 История ${id} очищена`, 'good');
    adminLogAdd(`clear history ${id}`, 'ok');
  };

  document.getElementById('admFullReset').onclick = () => {
    const id = document.getElementById('admManageId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    if (!confirm(`ПОЛНЫЙ СБРОС игрока ${id}?\nБаланс 1000, инвентарь и история удалены.`)) return;
    const { ref, saveFn } = adminGetStateFor(id);
    ref.balance = 1000;
    ref.inventory = [];
    ref.history = [];
    ref.lastRewardDate = '';
    ref.lastFaucetTime = 0;
    saveFn();
    toast(`💥 Игрок ${id} сброшен`, 'good');
    adminLogAdd(`FULL RESET ${id}`, 'err');
  };

  document.getElementById('admExportBtn').onclick = () => {
    const id = document.getElementById('admExportId').value.trim();
    if (!id) return toast('Укажи ID', 'bad');
    const { ref } = adminGetStateFor(id);
    document.getElementById('admJsonArea').value = JSON.stringify(ref, null, 2);
    toast('📤 Скопируй JSON из поля', 'good');
  };

  document.getElementById('admImportBtn').onclick = () => {
    const id = document.getElementById('admExportId').value.trim();
    const json = document.getElementById('admJsonArea').value.trim();
    if (!id || !json) return toast('Заполни ID и JSON', 'bad');
    let parsed;
    try { parsed = JSON.parse(json); } catch(e) { return toast('Неверный JSON', 'bad'); }
    if (id === userId) {
      state = Object.assign(state, parsed);
      save(); updateBalance(); renderInventory(); renderHistory(); shakeBalance();
    } else {
      try { localStorage.setItem('casedrop_' + id, JSON.stringify(parsed)); } catch(e) {}
    }
    toast(`📥 Импортировано → ${id}`, 'good');
    adminLogAdd(`import → ${id}`, 'ok');
  };

  document.getElementById('admMassAdd').onclick = () => {
    const sum = Math.max(0, Math.floor(Number(document.getElementById('admMassAmount').value) || 0));
    if (!sum) return toast('Укажи сумму', 'bad');
    if (!confirm(`Выдать ${fmtFull(sum)} ВСЕМ игрокам?`)) return;
    const players = adminListPlayers();
    let count = 0;
    players.forEach(p => {
      const { ref, saveFn } = adminGetStateFor(p.id);
      ref.balance = (ref.balance || 0) + sum;
      saveFn();
      count++;
    });
    toast(`📢 +${fmtFull(sum)} → ${count} игрокам`, 'good');
    adminLogAdd(`mass +${fmtFull(sum)} x${count}`, 'ok');
  };

  document.getElementById('admMassRem').onclick = () => {
    const sum = Math.max(0, Math.floor(Number(document.getElementById('admMassAmount').value) || 0));
    if (!sum) return toast('Укажи сумму', 'bad');
    if (!confirm(`Убрать ${fmtFull(sum)} у ВСЕХ игроков?`)) return;
    const players = adminListPlayers();
    players.forEach(p => {
      const { ref, saveFn } = adminGetStateFor(p.id);
      ref.balance = Math.max(0, (ref.balance || 0) - sum);
      saveFn();
    });
    toast(`📢 −${fmtFull(sum)} у всех`, 'good');
    adminLogAdd(`mass −${fmtFull(sum)} x${players.length}`, 'ok');
  };

  document.getElementById('admMassResetAll').onclick = () => {
    if (!confirm('СБРОСИТЬ ВСЕХ ИГРОКОВ? Это необратимо!')) return;
    const players = adminListPlayers();
    players.forEach(p => {
      if (p.isMe) return;
      const { ref, saveFn } = adminGetStateFor(p.id);
      ref.balance = 1000;
      ref.inventory = [];
      ref.history = [];
      saveFn();
    });
    toast('💥 Все игроки сброшены (кроме тебя)', 'good');
    adminLogAdd(`MASS RESET (${players.length - 1})`, 'err');
  };

  document.getElementById('admDeleteOthers').onclick = () => {
    if (!confirm('УДАЛИТЬ ВСЕХ кроме себя? Необратимо!')) return;
    const players = adminListPlayers();
    let count = 0;
    players.forEach(p => {
      if (!p.isMe) {
        try { localStorage.removeItem('casedrop_' + p.id); count++; } catch(e) {}
      }
    });
    toast(`🗑 Удалено ${count} игроков`, 'good');
    adminLogAdd(`DELETE ${count} players`, 'err');
  };

  document.getElementById('admMassGift').onclick = () => {
    const idx = Number(document.getElementById('admMassGiftSelect').value);
    const it = uniqItems[idx];
    if (!it) return toast('Выбери предмет', 'bad');
    if (!confirm(`Выдать "${it.name}" ВСЕМ игрокам?`)) return;
    const players = adminListPlayers();
    players.forEach(p => {
      const { ref, saveFn } = adminGetStateFor(p.id);
      const uid = 'm' + Date.now() + Math.random().toString(36).slice(2,6);
      ref.inventory.push({ ...it, uid });
      saveFn();
    });
    toast(`🎁 ${it.name} → ${players.length} игрокам`, 'good');
    adminLogAdd(`mass gift ${it.name} x${players.length}`, 'ok');
  };

  document.getElementById('admClearLog').onclick = () => {
    adminLog = [];
    renderLogList();
    toast('Лог очищен', 'good');
  };
}

/* ============ TABS ============ */
$$('#tabs .tab').forEach(t => {
  t.onclick = () => {
    const v = t.dataset.view;
    $$('#tabs .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $$('.view').forEach(x => x.classList.remove('active'));
    $('#view-' + v).classList.add('active');
    if (v === 'inventory') renderInventory();
    if (v === 'history') renderHistory();
    if (v === 'upgrade') renderUpgrader();
    if (v === 'leaders') renderLeaderboard();
    if (v === 'admin') renderAdmin();
  };
});

/* ============ OPEN BUTTONS ============ */
$('#open1').onclick = () => openCases(1);
$('#open2').onclick = () => openCases(2);
$('#open5').onclick = () => openCases(5);
$('#open10').onclick = () => openCases(10);

/* ============ INIT ============ */
load();
if (!state.selectedCase) state.selectedCase = CASES[0].id;
if (typeof state.lastFaucetTime !== 'number') state.lastFaucetTime = 0;
if (userId === ADMIN_ID) $('#adminTab').style.display = '';
updateBalance();
renderCases();
selectCase(state.selectedCase);
renderInventory();
renderHistory();
renderUpgrader();
renderGameSelector();
renderLeaderboard();
updateOpenButtons();
updateFaucet();

console.log('%c◈ CASE DROP NEON v6 ◈', 'color:#a855f7;font-size:18px;font-weight:bold');
console.log('User:', userName, '(', userId, ')');
console.log('Всего кейсов:', CASES.length);
console.log('Base rarity chances:', RARITY_CHANCE_BASE);
if (userId === ADMIN_ID) console.log('%c⚙️ РЕЖИМ АДМИНИСТРАТОРА АКТИВЕН', 'color:#22d3ee;font-weight:bold;font-size:14px');
</script>
</body>
</html>
